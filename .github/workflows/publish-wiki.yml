name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

# Concurrency garante que pushes simultaneos nao gerem race condition no wiki repo
# (que aceita apenas um clone-modify-push por vez).
concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Sync wiki/ -> GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Clone Wiki repo
        id: clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Setup one-time: GitHub Wiki precisa de UMA pagina criada pela UI antes
          # do .wiki.git existir. Se ainda nao foi feito, o clone retorna 128 com
          # "repository not found" - tratamos como skip (warning, nao falha) para
          # nao quebrar o CI da main. Apos o owner criar a primeira pagina em
          # Settings -> Wiki, este passo passa a clonar normalmente e o sync
          # acontece no proximo push.
          if git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-out 2>clone-err.log; then
            echo "Wiki clonado com sucesso."
            echo "wiki_ready=true" >> "$GITHUB_OUTPUT"
          else
            if grep -qi "not found" clone-err.log; then
              echo "::warning::Wiki nao bootstrapped ainda. Crie a primeira pagina via UI em Settings -> Wiki, depois re-execute este workflow."
              echo "wiki_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat clone-err.log >&2
            exit 1
          fi

      - name: Sync files
        if: steps.clone.outputs.wiki_ready == 'true'
        run: |
          set -euo pipefail
          # Remove apenas .md do destino antes de copiar — preserva binarios (imagens)
          # que possam ter sido uploadados via UI do wiki.
          find wiki-out -maxdepth 1 -name "*.md" -delete
          cp wiki/*.md wiki-out/
          echo "Arquivos sincronizados:"
          ls -la wiki-out/*.md

      - name: Commit + push
        if: steps.clone.outputs.wiki_ready == 'true'
        run: |
          set -euo pipefail
          cd wiki-out
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki ja esta sincronizado, nada a fazer."
            exit 0
          fi
          git commit -m "Sync wiki from main @ ${GITHUB_SHA::7}"
          git push
          echo "Wiki publicado: https://github.com/${{ github.repository }}/wiki"
